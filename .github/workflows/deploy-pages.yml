# Builds the app and deploys it to GitHub Pages (HTTPS, required for camera
# access on phones), then verifies the live site.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions". Runs on every push to main and can be run manually.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm test
      - name: Build for the Pages sub-path
        run: npm run build
        env:
          # e.g. "/Tennis/" for https://<user>.github.io/Tennis/
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - name: Check the pose model was bundled
        run: test "$(stat -c %s dist/models/pose_landmarker_lite.task)" -gt 1000000
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: All assets (JS, CSS, WASM, model, icons) return 200
        run: node scripts/verify-deployment.mjs "${{ needs.deploy.outputs.page_url }}"
      - run: npx playwright install --with-deps chromium
      - name: Browser tests against the live site (incl. camera permission flow)
        run: npx playwright test
        env:
          E2E_BASE_URL: ${{ needs.deploy.outputs.page_url }}
